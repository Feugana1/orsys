services:
  portainer:
    image: portainer/portainer-ce
    ports:
      - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'        
          memory: 512M
        reservations:
          memory: 256M 

volumes:
  portainer_data:
