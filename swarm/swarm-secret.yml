version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine # Version précise et image légère pour la sécurité et la performance
    ports:
      - "80:80"
    networks:
      - app-network
    deploy:
      mode: replicated
      replicas: 5
      placement:
        constraints:
          - "node.labels.mylabel == web"
      update_config:
        parallelism: 2
        delay: 10s
        order: start-first # Lance les nouveaux conteneurs avant d'arrêter les anciens (Zero Downtime)
        failure_action: rollback # Revient à la version précédente en cas d'échec du déploiement
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  db:
    image: postgres:16-alpine # Version majeure figée pour éviter les ruptures de compatibilité
    environment:
      POSTGRES_DB: myapp_db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password # Utilisation d'un secret Swarm au lieu du texte brut
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data # Persistance des données indispensable pour PostgreSQL
    networks:
      - app-network
    deploy:
      mode: replicated
      replicas: 1 # Une base de données Swarm standard ne doit pas être dupliquée sans cluster (ex: Patroni)
      placement:
        constraints:
          - "node.labels.mylabel == bdd"
      restart_policy:
        condition: on-failure
    healthcheck: # Garantit que la BDD est prête avant que d'autres services n'interagissent
      test: ["CMD-SHELL", "pg_isready -U db_user -d myapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: overlay # Requis pour la communication entre nœuds Swarm

volumes:
  db-data:
    driver: local # À remplacer par un driver de stockage partagé (ex: GlusterFS, Ceph) si la BDD doit migrer d'un nœud à un autre

secrets:
  db_password:
    external: true # Le secret doit être créé au préalable dans Swarm via: echo "mon_password" | docker secret create db_password -
